<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Heart Disease Prediction</title>

    <link rel="stylesheet" href="../static/style.css">

    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>
                Heart Disease Prediction System
            </h1>

            <p class="subtitle">
                AI Powered Smart Healthcare Assistant
            </p>

            <form action="/predict" method="post">

                <!-- AGE -->
                <div class="form-group">

                    <label>
                        Age

                        <span class="info">
                            <i class="fa-solid fa-circle-info"></i>

                            <span class="tooltip">
                                Enter patient's age in years.
                            </span>
                        </span>
                    </label>

                    <input type="number" name="Age" min="1" max="120" placeholder="Between 1-120" required>

                </div>

                <!-- GENDER -->
                <div class="form-group">

                    <label>
                        Gender

                        <span class="info">
                            <i class="fa-solid fa-circle-info"></i>

                            <span class="tooltip">
                                Biological gender of the patient.
                            </span>
                        </span>
                    </label>

                    <div class="radio-group">

                        <label>
                            <input type="radio" name="Gender" value="Male">
                            Male
                        </label>

                        <label>
                            <input type="radio" name="Gender" value="Female">
                            Female
                        </label>

                    </div>

                </div>

                <!-- CHOLESTEROL -->
                <div class="form-group">

                    <label>
                        Cholesterol

                        <span class="info">
                            <i class="fa-solid fa-circle-info"></i>

                            <span class="tooltip">
                                Total cholesterol level in mg/dL.
                            </span>
                        </span>
                    </label>

                    <input type="number" name="Cholesterol" min="100" max="600" placeholder="Between 100-600 mg/dL"
                        required>

                </div>

                <!-- BLOOD PRESSURE -->
                <div class="form-group">

                    <label>
                        Blood Pressure

                        <span class="info">
                            <i class="fa-solid fa-circle-info"></i>

                            <span class="tooltip">
                                Patient blood pressure value.
                            </span>
                        </span>
                    </label>

                    <input type="number" name="Blood Pressure" min="50" max="250" placeholder="Between 50-250" required>

                </div>

                <!-- HEART RATE -->
                <div class="form-group">

                    <label>
                        Heart Rate

                        <span class="info">
                            <i class="fa-solid fa-circle-info"></i>

                            <span class="tooltip">
                                Resting heart rate of patient.
                            </span>
                        </span>
                    </label>

                    <input type="number" name="Heart Rate" min="30" max="220" placeholder="Between 30-220 beats/min"
                        required>

                </div>

                <!-- SMOKING -->
                <div class="form-group">

                    <label>
                        Smoking

                        <span class="info">
                            <i class="fa-solid fa-circle-info"></i>

                            <span class="tooltip">
                                Smoking habit of patient.
                            </span>
                        </span>
                    </label>

                    <div class="radio-group">

                        <label>
                            <input type="radio" name="Smoking" value="Never">
                            Never
                        </label>

                        <label>
                            <input type="radio" name="Smoking" value="Current">
                            Current
                        </label>

                        <label>
                            <input type="radio" name="Smoking" value="Former">
                            Former
                        </label>

                    </div>

                </div>

                <!-- ALCOHOL -->
                <div class="form-group">

                    <label>
                        Alcohol Intake

                        <span class="info">
                            <i class="fa-solid fa-circle-info"></i>

                            <span class="tooltip">
                                Alcohol consumption level.
                            </span>
                        </span>
                    </label>

                    <div class="radio-group">

                        <label>
                            <input type="radio" name="Alcohol Intake" value="Heavy">
                            Heavy
                        </label>

                        <label>
                            <input type="radio" name="Alcohol Intake" value="Unknown">
                            Unknown
                        </label>

                        <label>
                            <input type="radio" name="Alcohol Intake" value="Moderate">
                            Moderate
                        </label>

                    </div>

                </div>

                <!-- EXERCISE HOURS -->
                <div class="form-group">

                    <label>
                        Exercise Hours

                        <span class="info">
                            <i class="fa-solid fa-circle-info"></i>

                            <span class="tooltip">
                                Number of exercise hours per week.
                            </span>
                        </span>
                    </label>

                    <input type="number" name="Exercise Hours" min="0" max="24" placeholder="Between 0-24 hrs"
                        step="0.1" required>

                </div>

                <!-- FAMILY HISTORY -->
                <div class="form-group">

                    <label>
                        Family History

                        <span class="info">
                            <i class="fa-solid fa-circle-info"></i>

                            <span class="tooltip">
                                Family history of heart disease.
                            </span>
                        </span>
                    </label>

                    <div class="radio-group">

                        <label>
                            <input type="radio" name="Family History" value="Yes">
                            Yes
                        </label>

                        <label>
                            <input type="radio" name="Family History" value="No">
                            No
                        </label>

                    </div>

                </div>

                <!-- DIABETES -->
                <div class="form-group">

                    <label>
                        Diabetes

                        <span class="info">
                            <i class="fa-solid fa-circle-info"></i>

                            <span class="tooltip">
                                Whether patient has diabetes.
                            </span>
                        </span>
                    </label>

                    <div class="radio-group">

                        <label>
                            <input type="radio" name="Diabetes" value="Yes">
                            Yes
                        </label>

                        <label>
                            <input type="radio" name="Diabetes" value="No">
                            No
                        </label>

                    </div>

                </div>

                <!-- OBESITY -->
                <div class="form-group">

                    <label>
                        Obesity

                        <span class="info">
                            <i class="fa-solid fa-circle-info"></i>

                            <span class="tooltip">
                                Whether patient is obese.
                            </span>
                        </span>
                    </label>

                    <div class="radio-group">

                        <label>
                            <input type="radio" name="Obesity" value="Yes">
                            Yes
                        </label>

                        <label>
                            <input type="radio" name="Obesity" value="No">
                            No
                        </label>

                    </div>

                </div>

                <!-- STRESS LEVEL -->
                <div class="form-group">

                    <label>
                        Stress Level

                        <span class="info">
                            <i class="fa-solid fa-circle-info"></i>

                            <span class="tooltip">
                                Stress level from 1 to 10.
                            </span>
                        </span>
                    </label>

                    <input type="number" name="Stress Level" min="1" max="10" placeholder="Between 1-10" required>

                </div>

                <!-- BLOOD SUGAR -->
                <div class="form-group">

                    <label>
                        Blood Sugar

                        <span class="info">
                            <i class="fa-solid fa-circle-info"></i>

                            <span class="tooltip">
                                Blood sugar level in mg/dL.
                            </span>
                        </span>
                    </label>

                    <input type="number" name="Blood Sugar" min="50" max="500" placeholder="Between 50-500 mg/dL"
                        required>

                </div>

                <!-- EXERCISE INDUCED ANGINA -->
                <div class="form-group">

                    <label>
                        Exercise Induced Angina

                        <span class="info">
                            <i class="fa-solid fa-circle-info"></i>

                            <span class="tooltip">
                                Chest pain during exercise.
                            </span>
                        </span>
                    </label>

                    <div class="radio-group">

                        <label>
                            <input type="radio" name="Exercise Induced Angina" value="Yes">
                            Yes
                        </label>

                        <label>
                            <input type="radio" name="Exercise Induced Angina" value="No">
                            No
                        </label>

                    </div>

                </div>

                <!-- CHEST PAIN -->

                <div class="form-group full-width">

                    <label>
                        Chest Pain Type

                        <span class="info">
                            <i class="fa-solid fa-circle-info"></i>

                            <span class="tooltip">
                                Type of chest pain experienced by the patient.
                            </span>
                        </span>
                    </label>

                    <div class="radio-group">

                        <!-- NON ANGINAL -->

                        <label class="option-tooltip">

                            <input type="radio" name="Chest Pain Type" value="Non-anginal Pain">

                            Non-anginal Pain

                            <span class="option-info">
                                Chest pain not related to heart problems.
                            </span>

                        </label>

                        <!-- TYPICAL ANGINA -->

                        <label class="option-tooltip">

                            <input type="radio" name="Chest Pain Type" value="Typical Angina">

                            Typical Angina

                            <span class="option-info">
                                Classic heart-related chest pain caused by reduced blood flow.
                            </span>

                        </label>

                        <!-- ASYMPTOMATIC -->

                        <label class="option-tooltip">

                            <input type="radio" name="Chest Pain Type" value="Asymptomatic">

                            Asymptomatic

                            <span class="option-info">
                                No visible chest pain symptoms despite possible heart disease.
                            </span>

                        </label>

                        <!-- ATYPICAL ANGINA -->

                        <label class="option-tooltip">

                            <input type="radio" name="Chest Pain Type" value="Atypical Angina">

                            Atypical Angina

                            <span class="option-info">
                                Unusual chest pain that may not follow classic angina symptoms.
                            </span>

                        </label>

                    </div>

                </div>

        </div>

        <!-- BUTTON -->
        <button type="submit">
            Predict Heart Disease
        </button>

        </form>

    </div>

    </div>

</body>

</html>
