<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Heart Disease Prediction</title>

    <link rel="stylesheet" href="../static/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>
                Heart Disease Prediction System
            </h1>

            <!-- <p class="subtitle">
                Cleveland Heart Disease Dataset
            </p> -->

            <form action="/predict" method="POST">

                <!-- AGE -->

                <div class="form-group">

                    <label>

                        Age

                        <span class="info">

                            <i class="fa-solid fa-circle-info"></i>

                            <span class="tooltip">
                                Age of the patient in years.
                            </span>

                        </span>

                    </label>

                    <input type="number"
                        name="age"
                        min="1"
                        max="120"
                        required>

                </div>

                <!-- SEX -->

                <div class="form-group">

                    <label>

                        Sex

                        <span class="info">

                            <i class="fa-solid fa-circle-info"></i>

                            <span class="tooltip">
                                Biological gender of the patient.
                            </span>

                        </span>

                    </label>

                    <div class="radio-group">

                        <label>

                            <input type="radio"
                                name="sex"
                                value="Male"
                                required>

                            Male

                        </label>

                        <label>

                            <input type="radio"
                                name="sex"
                                value="Female">

                            Female

                        </label>

                    </div>

                </div>

                <!-- CHEST PAIN -->

                <div class="form-group full-width">

                    <label>

                        Chest Pain Type

                        <span class="info">

                            <i class="fa-solid fa-circle-info"></i>

                            <span class="tooltip">
                                Type of chest pain experienced by the patient.
                            </span>

                        </span>

                    </label>

                    <div class="radio-group">

                        <label class="option-tooltip">

                            <input type="radio"
                                name="cp"
                                value="Typical Angina"
                                required>

                            Typical Angina

                            <span class="option-info">
                                Classic chest pain caused due to reduced blood flow to heart.
                            </span>

                        </label>

                        <label class="option-tooltip">

                            <input type="radio"
                                name="cp"
                                value="Atypical Angina">

                            Atypical Angina

                            <span class="option-info">
                                Unusual chest pain that may still be related to heart problems.
                            </span>

                        </label>

                        <label class="option-tooltip">

                            <input type="radio"
                                name="cp"
                                value="Non-anginal Pain">

                            Non-anginal Pain

                            <span class="option-info">
                                Chest pain not caused because of heart disease.
                            </span>

                        </label>

                        <label class="option-tooltip">

                            <input type="radio"
                                name="cp"
                                value="Asymptomatic">

                            Asymptomatic

                            <span class="option-info">
                                No chest pain symptoms present.
                            </span>

                        </label>

                    </div>

                </div>

                <!-- BLOOD PRESSURE -->

                <div class="form-group">

                    <label>

                        Resting Blood Pressure

                        <span class="info">

                            <i class="fa-solid fa-circle-info"></i>

                            <span class="tooltip">
                                Blood pressure measured while resting.
                            </span>

                        </span>

                    </label>

                    <input type="number"
                        name="trestbps"
                        min="50"
                        max="250"
                        required>

                </div>

                <!-- CHOLESTEROL -->

                <div class="form-group">

                    <label>

                        Cholesterol

                        <span class="info">

                            <i class="fa-solid fa-circle-info"></i>

                            <span class="tooltip">
                                Cholesterol level in blood.
                            </span>

                        </span>

                    </label>

                    <input type="number"
                        name="chol"
                        min="100"
                        max="600"
                        required>

                </div>

                <!-- FASTING BLOOD SUGAR -->

                <div class="form-group">

                    <label>

                        Fasting Blood Sugar > 120

                        <span class="info">

                            <i class="fa-solid fa-circle-info"></i>

                            <span class="tooltip">
                                Whether fasting blood sugar is greater than 120 mg/dL.
                            </span>

                        </span>

                    </label>

                    <div class="radio-group">

                        <label>

                            <input type="radio"
                                name="fbs"
                                value="Yes"
                                required>

                            Yes

                        </label>

                        <label>

                            <input type="radio"
                                name="fbs"
                                value="No">

                            No

                        </label>

                    </div>

                </div>

                <!-- REST ECG -->

                <div class="form-group full-width">

                    <label>

                        Rest ECG

                        <span class="info">

                            <i class="fa-solid fa-circle-info"></i>

                            <span class="tooltip">
                                Resting electrocardiographic result.
                            </span>

                        </span>

                    </label>

                    <div class="radio-group">

                        <label class="option-tooltip">

                            <input type="radio"
                                name="restecg"
                                value="Normal"
                                required>

                            Normal

                            <span class="option-info">
                                Normal ECG result.
                            </span>

                        </label>

                        <label class="option-tooltip">

                            <input type="radio"
                                name="restecg"
                                value="ST-T Wave Abnormality">

                            ST-T Wave Abnormality

                            <span class="option-info">
                                Small abnormal changes in ECG waves.
                            </span>

                        </label>

                        <label class="option-tooltip">

                            <input type="radio"
                                name="restecg"
                                value="Left Ventricular Hypertrophy">

                            Left Ventricular Hypertrophy

                            <span class="option-info">
                                Thickening of left heart chamber walls.
                            </span>

                        </label>

                    </div>

                </div>

                <!-- MAX HEART RATE -->

                <div class="form-group">

                    <label>

                        Maximum Heart Rate

                        <span class="info">

                            <i class="fa-solid fa-circle-info"></i>

                            <span class="tooltip">
                                Highest heart rate achieved during test.
                            </span>

                        </span>

                    </label>

                    <input type="number"
                        name="thalach"
                        min="50"
                        max="250"
                        required>

                </div>

                <!-- EXANG -->

                <div class="form-group">

                    <label>

                        Exercise Induced Angina

                        <span class="info">

                            <i class="fa-solid fa-circle-info"></i>

                            <span class="tooltip">
                                Chest pain caused during exercise.
                            </span>

                        </span>

                    </label>

                    <div class="radio-group">

                        <label>

                            <input type="radio"
                                name="exang"
                                value="Yes"
                                required>

                            Yes

                        </label>

                        <label>

                            <input type="radio"
                                name="exang"
                                value="No">

                            No

                        </label>

                    </div>

                </div>

                <!-- OLDPEAK -->

                <div class="form-group">

                    <label>

                        Old Peak

                        <span class="info">

                            <i class="fa-solid fa-circle-info"></i>

                            <span class="tooltip">
                                ST depression caused due to exercise.
                            </span>

                        </span>

                    </label>

                    <input type="number"
                        step="0.1"
                        name="oldpeak"
                        min="0"
                        max="10"
                        required>

                </div>

                <!-- SLOPE -->

                <div class="form-group full-width">

                    <label>

                        Slope

                        <span class="info">

                            <i class="fa-solid fa-circle-info"></i>

                            <span class="tooltip">
                                Slope of peak exercise ECG segment.
                            </span>

                        </span>

                    </label>

                    <div class="radio-group">

                        <label class="option-tooltip">

                            <input type="radio"
                                name="slope"
                                value="Upsloping"
                                required>

                            Upsloping

                            <span class="option-info">
                                ECG line rises upward during exercise.
                            </span>

                        </label>

                        <label class="option-tooltip">

                            <input type="radio"
                                name="slope"
                                value="Flat">

                            Flat

                            <span class="option-info">
                                ECG line remains flat during exercise.
                            </span>

                        </label>

                        <label class="option-tooltip">

                            <input type="radio"
                                name="slope"
                                value="Downsloping">

                            Downsloping

                            <span class="option-info">
                                ECG line slopes downward during exercise.
                            </span>

                        </label>

                    </div>

                </div>

                <!-- CA -->

                <div class="form-group">

                    <label>

                        Major Vessels (CA)

                        <span class="info">

                            <i class="fa-solid fa-circle-info"></i>

                            <span class="tooltip">
                                Number of major blood vessels detected.
                            </span>

                        </span>

                    </label>

                    <input type="number"
                        name="ca"
                        min="0"
                        max="3"
                        required>

                </div>

                <!-- THAL -->

                <div class="form-group full-width">

                    <label>

                        Thal

                        <span class="info">

                            <i class="fa-solid fa-circle-info"></i>

                            <span class="tooltip">
                                Thalassemia blood disorder test result.
                            </span>

                        </span>

                    </label>

                    <div class="radio-group">

                        <label class="option-tooltip">

                            <input type="radio"
                                name="thal"
                                value="Normal"
                                required>

                            Normal

                            <span class="option-info">
                                Normal blood flow detected.
                            </span>

                        </label>

                        <label class="option-tooltip">

                            <input type="radio"
                                name="thal"
                                value="Fixed Defect">

                            Fixed Defect

                            <span class="option-info">
                                Permanent blood flow defect in heart.
                            </span>

                        </label>

                        <label class="option-tooltip">

                            <input type="radio"
                                name="thal"
                                value="Reversible Defect">

                            Reversible Defect

                            <span class="option-info">
                                Temporary blood flow problem during exercise.
                            </span>

                        </label>

                    </div>

                </div>

                <button type="submit">
                    Predict Heart Disease
                </button>

            </form>

        </div>

    </div>

</body>

</html>
